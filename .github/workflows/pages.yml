# Run the tests, rebuild the dashboard and publish only that page to GitHub Pages.
# Enable once: Settings > Pages > Source: GitHub Actions.
name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --all-extras
      - run: uv run python -m pytest -q
      - run: uv run python -m recon run --fresh --quiet --out "$RUNNER_TEMP/out"
      - run: mkdir site && cp "$RUNNER_TEMP/out/dashboard.html" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
